name: Bug report
description: Report incorrect behavior in a future implementation or a specification inconsistency.
title: "[Bug] "
labels: ["kind:bug"]
body:
  - type: markdown
    attributes:
      value: "Planning stage: no executable engine exists yet. Use the RFC form for design proposals. Do not include secrets or production data."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include platform, filesystem and deployment mode when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact steps or conflicting document paths and a sanitized fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: State the violated guarantee and whether acknowledged data, history or work is affected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs, errors, relevant configuration and test output.

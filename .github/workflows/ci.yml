name: Foundation CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.runner }}, Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
        rust: ['1.85.0', '1.97.1']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust and lint components
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Verify workspace and contracts
        run: python3 tools/verify.py
      - name: Demonstrate gate failures
        if: matrix.runner == 'ubuntu-24.04' && matrix.rust == '1.85.0'
        run: python3 tools/probe_gates.py
      - name: Save bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-${{ matrix.runner }}-${{ matrix.rust }}
          path: |
            docs/specs/*.json
            docs/fixtures/**/*.hex
            docs/fixtures/**/*.json
            Cargo.lock
          retention-days: 7
          if-no-files-found: error
